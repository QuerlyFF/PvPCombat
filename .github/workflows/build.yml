name: Build PvPCombat

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Java source style
        run: python3 .github/scripts/check_java_style.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PvPCombat-jar
          path: target/PvPCombat.jar
