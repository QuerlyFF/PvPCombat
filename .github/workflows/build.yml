name: Build PvPCombat

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check Java source style
        run: python3 .github/scripts/check_java_style.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and test
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PvPCombat-test-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: PvPCombat-jar
          path: target/PvPCombat.jar
